name: agent-checks change-record
description: Fail unless the pull request body carries Spec, Claim, Checks, Scope, Risk and Agent, and every changed file is inside Scope.
branding:
  icon: check-circle
  color: green
inputs:
  base:
    description: "Ref to diff against for the Scope check. 'auto' uses the PR merge commit's first parent; empty skips the Scope check."
    default: auto
runs:
  using: composite
  steps:
    - name: Install agent-checks from this action's checkout
      shell: bash
      run: pipx install --quiet "${{ github.action_path }}/.."
    - name: Make sure the base commit is present
      if: inputs.base != ''
      shell: bash
      run: git rev-parse -q --verify HEAD^1 >/dev/null || git fetch --quiet --deepen=1 origin "$(git rev-parse HEAD)"
    - name: agent-checks change-record
      shell: bash
      env:
        BASE: ${{ inputs.base }}
      run: agent-checks change-record --format github ${BASE:+--base "$BASE"}
