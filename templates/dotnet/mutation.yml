name: mutation

# Stryker.NET mutation testing on the code a PR changes (--since), report only until you raise break-at.
# CPU-heavy: run it on a schedule or by hand, not on every push. Copy to .github/workflows/ and set TEST_PROJECT.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  TEST_PROJECT: tests/MyApp.Tests/MyApp.Tests.csproj  # the test project whose target gets mutated
  BREAK_AT: "0"                                        # mutation score below which the job fails; 0 = report only
  STRYKER_VERSION: "5.0.0"

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Stryker
        run: |
          dotnet tool update --global dotnet-stryker --version "$STRYKER_VERSION"
          cd "$(dirname "$TEST_PROJECT")"
          # --concurrency 2 keeps a shared runner usable.
          dotnet stryker --reporter html --reporter markdown --concurrency 2 --break-at "$BREAK_AT"
          # agent-checks: allow weakened-gate -- the summary is optional; a missing report must not fail the job
          find StrykerOutput -name '*.md' -exec cat {} + >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stryker-report
          path: "**/StrykerOutput/**/reports/*"
          retention-days: 30
