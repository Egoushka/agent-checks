id: empty-catch.csharp
language: CSharp
rule:
  kind: catch_clause
  has: {field: body, regex: '^\{\s*\}$'}
  # `catch (X e) when (cond) { }` is a narrow, deliberate filter.
  not: {has: {kind: catch_filter_clause}}
---
