name: agent-checks
description: Check the lines a pull request adds for agent smells (skipped tests, empty catches, silenced warnings, stubs, tests without assertions).
branding:
  icon: check-circle
  color: green
inputs:
  base:
    description: "Ref to diff against. 'auto' uses the PR merge commit's first parent."
    default: auto
runs:
  using: composite
  steps:
    - name: Install agent-checks from this action's checkout
      shell: bash
      run: pipx install --quiet "${{ github.action_path }}"
    - name: Make sure the base commit is present
      shell: bash
      run: git rev-parse -q --verify HEAD^1 >/dev/null || git fetch --quiet --deepen=1 origin "$(git rev-parse HEAD)"
    - name: agent-checks
      shell: bash
      env:
        BASE: ${{ inputs.base }}
      run: agent-checks check --base "$BASE" --format github
