# Checks the lines a pull request adds: https://github.com/Egoushka/agent-checks
name: agent-checks
on: pull_request
permissions:
  contents: read
jobs:
  agent-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      # This repo tests its own action from the PR checkout.
      - uses: ./  # zizmor: ignore[self-repository] this repo tests its own action from the PR checkout
